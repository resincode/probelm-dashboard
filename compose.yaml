# Podman machine (macOS, once): podman machine init --memory 2048 --cpus 2; podman machine start
# A Compose provider is required: install podman-compose or Docker Compose for podman compose.
# Start: ./deploy/init.sh && podman compose up -d --build
# Stop: podman compose down (NEVER use down -v unless intentionally deleting history).
# Existing host DB: ./deploy/database.sh migrate "$HOME/.config/probelm/dashboard.db"
# Run migration after building the image, before first start; it refuses a populated volume.
# HTTP localhost default only. Behind an HTTPS reverse proxy set COOKIE_SECURE=true.
# Also set APP_ORIGIN to the canonical external origin, e.g. https://status.example.com.
# Set PROBE_ALLOWED_PRIVATE_HOSTS='' to disallow all private hosts. Add only trusted
# exact hostnames/IPs when needed; never expose the 9Router credential endpoint publicly.
name: probelm-dashboard
x-runtime: &runtime
  image: ${PROBE_IMAGE:-localhost/probelm-dashboard:latest}
  restart: unless-stopped
  init: true
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
  volumes:
    - data:/data:U
  secrets:
    - probe_master_key
  environment: &environment
    NODE_ENV: production
    PROBE_DB: /data/dashboard.db
    PROBE_MASTER_KEY_FILE: /run/secrets/probe_master_key
    PROBE_ALLOWED_PRIVATE_HOSTS: ${PROBE_ALLOWED_PRIVATE_HOSTS-host.containers.internal}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    APP_ORIGIN: ${APP_ORIGIN:-}
    NODE_OPTIONS: --max-old-space-size=384
  stop_grace_period: 45s
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128
services:
  web:
    <<: *runtime
    build:
      context: .
      dockerfile: Containerfile
    command: [node, .output/server/index.mjs]
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      <<: *environment
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-piknik}
    healthcheck:
      test: [CMD, node, scripts/web-healthcheck.mjs]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  worker:
    <<: *runtime
    command: [node, node_modules/tsx/dist/cli.mjs, scripts/worker.ts]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, scripts/worker-healthcheck.mjs]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  data:
    name: ${PROBE_DATA_VOLUME:-probelm-dashboard-data}
secrets:
  probe_master_key:
    file: ./.secrets/master-key
